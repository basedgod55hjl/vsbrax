[package]
name = "abrasax-provider-doctor"
version = "0.1.0"
edition = "2024"
publish = false

# Provider diagnostics that sit downstream of abrasax-base: the strict
# `abrasax provider-doctor` end-to-end runner (provider_e2e), the live provider
# probes it drives, and the auth-lifecycle contract driver. Split out of
# abrasax-base so edits to the doctor cluster no longer rebuild the
# base -> app-core -> tui spine, and base compiles faster with lower peak
# memory.

[lib]
name = "abrasax_provider_doctor"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

# default-features = false: the doctor only needs base's always-on surface
# (auth, provider runtimes, provider_catalog, live_tests). Feature unification
# in the root binary re-enables embeddings/bedrock there.
abrasax-base = { path = "../abrasax-base", default-features = false }
abrasax-provider-gemini-runtime = { path = "../abrasax-provider-gemini-runtime" }
abrasax-provider-anthropic-runtime = { path = "../abrasax-provider-anthropic-runtime" }
abrasax-provider-openai-runtime = { path = "../abrasax-provider-openai-runtime" }
abrasax-provider-openrouter-runtime = { path = "../abrasax-provider-openrouter-runtime" }
abrasax-provider-cursor-runtime = { path = "../abrasax-provider-cursor-runtime" }
abrasax-provider-antigravity-runtime = { path = "../abrasax-provider-antigravity-runtime" }
abrasax-provider-copilot-runtime = { path = "../abrasax-provider-copilot-runtime" }

[dev-dependencies]
# The auth-lifecycle driver tests run inside abrasax-base's auth test sandbox.
abrasax-base = { path = "../abrasax-base", default-features = false, features = ["test-support"] }
abrasax-provider-metadata = { path = "../abrasax-provider-metadata" }
tokio = { version = "1", features = ["macros", "rt"] }
