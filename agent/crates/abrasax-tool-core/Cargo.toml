[package]
name = "abrasax-tool-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "abrasax_tool_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
abrasax-agent-runtime = { path = "../abrasax-agent-runtime" }
abrasax-message-types = { path = "../abrasax-message-types" }
abrasax-tool-types = { path = "../abrasax-tool-types" }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
