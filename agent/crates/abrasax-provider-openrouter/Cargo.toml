[package]
name = "abrasax-provider-openrouter"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytes = "1"
futures = "0.3"
abrasax-core = { path = "../abrasax-core" }
abrasax-logging = { path = "../abrasax-logging" }
abrasax-message-types = { path = "../abrasax-message-types" }
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
