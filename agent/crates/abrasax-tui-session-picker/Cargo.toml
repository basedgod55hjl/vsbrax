[package]
name = "abrasax-tui-session-picker"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
abrasax-message-types = { path = "../abrasax-message-types" }
abrasax-session-types = { path = "../abrasax-session-types" }
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]
