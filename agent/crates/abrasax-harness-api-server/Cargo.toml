[package]
name = "abrasax-harness-api-server"
version = "0.1.0"
edition = "2024"
publish = false
description = "Harness API endpoint: bridges versioned API clients onto the internal abrasax protocol"

[dependencies]
anyhow = "1"
abrasax-harness-api = { path = "../abrasax-harness-api" }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "rt", "macros", "sync"] }

[dev-dependencies]
# The parser in `background_progress` reads markdown produced by the daemon's
# own formatter, so the contract test builds that formatter rather than a copy
# of its output: a change to the wire prose then fails here instead of silently
# turning every client's progress bar off. Dev-only, so the bridge binary stays
# free of the application foundation.
abrasax-base = { path = "../abrasax-base", default-features = false }
abrasax-background-types = { path = "../abrasax-background-types" }

[[bin]]
name = "abrasax-harness-api-bridge"
path = "src/bin/bridge.rs"
