[package]
name = "abrasax-build-support"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
abrasax-core = { path = "../abrasax-core" }
abrasax-selfdev-types = { path = "../abrasax-selfdev-types" }
abrasax-storage = { path = "../abrasax-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
