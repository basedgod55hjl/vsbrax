[package]
name = "abrasax-tui"
version = "0.1.0"
edition = "2024"
publish = false

# Presentation layer for abrasax: the terminal UI (`tui`) and the offline replay
# `video_export`, extracted out of the monolithic root `abrasax` crate so they
# compile as a separate rustc unit. This crate builds on top of the application
# core (`abrasax-app-core`) and re-exports it via `pub use abrasax_app_core::*`, so
# every existing `crate::<module>` path (e.g. `crate::config`, `crate::server`)
# keeps resolving unchanged across the tui code that was moved here. The root
# `abrasax` crate (cli + bin) in turn re-exports this crate via
# `pub use abrasax_tui::*`.

[lib]
name = "abrasax_tui"
path = "src/lib.rs"

[dependencies]
# Application core (server, agent, provider, auth, session, tool, config, ...).
# Re-exported via `pub use abrasax_app_core::*` in lib.rs. default-features=false
# so this crate (and ultimately the root crate) controls app-core's features.
abrasax-app-core = { path = "../abrasax-app-core", default-features = false }

# Pure math kernels for the idle animations (3D samplers, glyph chooser,
# HSV->RGB). Pinned to opt-level = 3 in all profiles via workspace Cargo.toml so
# the hot trig loops stay optimized even in debug/selfdev builds.
abrasax-tui-anim = { path = "../abrasax-tui-anim" }

# Async runtime
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

# Utilities
anyhow = "1"
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
dirs = "5"
similar = "2"
tempfile = "3"
open = "5"

# OAuth / hashing helpers used by the login + account UI
base64 = "0.22"
sha2 = "0.10"
rand = "0.9.3"
hex = "0.4"
url = "2"
urlencoding = "2"

# TUI
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
unicode-width = "0.2"

# Presentation-layer workspace crates
abrasax-build-meta = { path = "../abrasax-build-meta" }
abrasax-logging = { path = "../abrasax-logging" }
abrasax-core = { path = "../abrasax-core" }
abrasax-fuzzy = { path = "../abrasax-fuzzy" }
abrasax-config-types = { path = "../abrasax-config-types" }
abrasax-selfdev-types = { path = "../abrasax-selfdev-types" }
abrasax-session-types = { path = "../abrasax-session-types" }
abrasax-provider-core = { path = "../abrasax-provider-core" }
abrasax-tui-markdown = { path = "../abrasax-tui-markdown" }
abrasax-tui-messages = { path = "../abrasax-tui-messages" }
abrasax-tui-core = { path = "../abrasax-tui-core" }
abrasax-tui-mermaid = { path = "../abrasax-tui-mermaid" }
abrasax-tui-account-picker = { path = "../abrasax-tui-account-picker" }
abrasax-tui-render = { path = "../abrasax-tui-render" }
abrasax-tui-visual-debug = { path = "../abrasax-tui-visual-debug" }
abrasax-tui-session-picker = { path = "../abrasax-tui-session-picker", features = ["serde"] }
abrasax-tui-style = { path = "../abrasax-tui-style" }
terminal-colorsaurus = "1.0"
abrasax-tui-permissions = { path = "../abrasax-tui-permissions" }
abrasax-tui-tool-display = { path = "../abrasax-tui-tool-display" }
abrasax-tui-usage-overlay = { path = "../abrasax-tui-usage-overlay" }
abrasax-terminal-image = { path = "../abrasax-terminal-image" }
abrasax-productivity-core = { path = "../abrasax-productivity-core" }
abrasax-tui-workspace = { path = "../abrasax-tui-workspace" }

[features]
default = ["pdf", "embeddings", "bedrock"]
# Exposes bench-only debug helpers (e.g. debug_copy_selection_text_for_bench)
# consumed by the dev `tui_bench` binary in the root crate.
dev-bins = []
# Forwarded to app-core (and onward to abrasax-base) so the root crate's feature
# set fully controls the optional stacks.
jemalloc = ["abrasax-app-core/jemalloc"]
jemalloc-prof = ["abrasax-app-core/jemalloc-prof"]
embeddings = ["abrasax-app-core/embeddings"]
pdf = ["abrasax-app-core/pdf"]
bedrock = ["abrasax-app-core/bedrock"]
linux-compat-vendored-openssl = ["abrasax-app-core/linux-compat-vendored-openssl"]
mmdr-size-api = ["abrasax-tui-mermaid/mmdr-size-api"]
# Forwards the application core's `test-support` feature (and onward to
# abrasax-base) so downstream crates' test targets can reach the whole stack's
# test helpers. Never enabled in normal (non-test) builds.
test-support = ["abrasax-app-core/test-support"]

[dev-dependencies]
# Enables the downstream test-support helpers for *this* crate's own test
# target. Feature unification applies this only to test/bench/example builds.
abrasax-app-core = { path = "../abrasax-app-core", default-features = false, features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.7"
