[package]
name = "abrasax-tui-permissions"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "abrasax_tui_permissions"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
crossterm = { version = "0.29", features = ["event-stream"] }
abrasax-base = { path = "../abrasax-base", default-features = false }
abrasax-core = { path = "../abrasax-core" }
abrasax-tui-style = { path = "../abrasax-tui-style" }
ratatui = "0.30"
serde_json = "1"
