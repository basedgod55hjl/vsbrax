[package]
name = "abrasax-desktop2"
version = "0.1.0"
edition = "2024"
publish = false
description = "Greenfield abrasax desktop app: winit + wgpu + Vello + Parley over the harness API"

[dependencies]
anyhow = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
abrasax-build-meta = { path = "../abrasax-build-meta" }
abrasax-harness-api = { path = "../abrasax-harness-api" }
abrasax-render-core = { path = "../abrasax-render-core" }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
unicode-width = "0.2"
parley = "0.11"
pollster = "0.3"
serde_json = "1"
vello = "0.9"
winit = "0.30"

[[bin]]
name = "abrasax-desktop2"
path = "src/main.rs"
