[package]
name = "abrasax-telemetry-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "abrasax_telemetry_core"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
abrasax-build-meta = { path = "../abrasax-build-meta" }
abrasax-core = { path = "../abrasax-core" }
abrasax-logging = { path = "../abrasax-logging" }
abrasax-provider-core = { path = "../abrasax-provider-core" }
abrasax-selfdev-types = { path = "../abrasax-selfdev-types" }
abrasax-storage = { path = "../abrasax-storage" }
abrasax-usage-types = { path = "../abrasax-usage-types" }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }
serde_json = "1"
walkdir = "2"
tokio = { version = "1", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
